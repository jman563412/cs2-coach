[package]
name = "gsi-listener"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gsi-listener"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
