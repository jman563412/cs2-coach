// Manual one-time setup:
// 1. Copy this file into CS2's cfg folder, typically:
//    C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// 2. In Steam, right-click Counter-Strike 2 -> Properties -> General -> Launch Options, and set:
//    "C:\Windows\System32\wscript.exe" "<deploy folder>\launch_with_listener.vbs" %command%
//    where <deploy folder> is wherever scripts/deploy_to_windows.sh copied the listener (e.g. D:\cs2-coach\bin).
//    Running it straight from the repo over \\wsl.localhost\<distro>\<path-to-repo>\... also works, but Windows
//    then asks about an unverified publisher on every launch (see deploy_to_windows.sh).
//    Routing through wscript.exe directly -- rather than a .bat file -- means no
//    cmd.exe console ever gets created, so nothing visible appears at launch.
//    No "--" before %command% -- that's a Linux/Proton wrapper convention that tools
//    like mangohud parse themselves; the .vbs script takes %command%'s tokens as-is.)
"CS2 Coach GSI"
{
 "uri" "http://127.0.0.1:3909"
 "timeout" "5.0"
 "buffer"  "0.1"
 "throttle" "0.5"
 "heartbeat" "60.0"
 "data"
 {
  "provider"            "1"
  "map"                 "1"
  "round"               "1"
  "player_id"           "1"
  "player_state"        "1"
  "player_weapons"      "1"
  "player_match_stats"  "1"
  "allplayers_id"       "1"
  "allplayers_state"    "1"
  "allplayers_match_stats" "1"
  "phase_countdowns"    "1"
  "bomb"                "1"
 }
}
